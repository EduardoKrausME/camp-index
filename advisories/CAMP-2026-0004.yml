id: CAMP-2026-0004
component: quizaccess_campla
title: Defective publication record, withdrawn (not a security issue)
severity: low
affected-versions: =v5.2-r1
fixed-in: v5.2-r2
revoke: true
published: '2026-07-27T00:00:00Z'
description: >
  Not a vulnerability. The v5.2-r1 release record was published from a
  workflow run whose ref was the default branch rather than a tag, so
  the ledger recorded tag "main" at the then-current commit. The
  recorded artifact hash is intact and the archived ZIP matches it, but
  the record references a moveable ref and can never verify again, and
  the maintainer's real v5.2-r1 tag points at a different commit than
  what was published. The version is withdrawn from installation
  channels; v5.2-r2, built at an immutable tag, supersedes it. Sites
  that installed v5.2-r1 got code identical to the archived artifact
  and should simply upgrade to v5.2-r2. Tooling now refuses non-tag
  refs at publication (camp-tools#15).
